name: Backtest BSK — temporada corrente

on:
  push:
    branches: [melhorias-modelo-nba]
    paths:
      - "backtest.py"
      - "test_backtest.py"
      - "dados.js"
      - "jogos.json"
      - ".github/workflows/backtest-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bsk-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atualizar-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: melhorias-modelo-nba
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check "nba_api>=1.9,<2"
      - name: Verificar código e testes
        run: |
          python -m py_compile backtest.py test_backtest.py
          python -m unittest -v test_backtest.py
      - name: Atualizar relatório da temporada
        run: python backtest.py
      - name: Publicar resultados na branch de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_resultados.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar holdout temporal de backtest [skip ci]"
            git push origin HEAD:melhorias-modelo-nba
          fi
