name: Atualizar dados da NBA

on:
  schedule:
    - cron: "0 18 * * *"   # 15h no horario de Brasilia (as horas do GitHub sao em UTC)
    - cron: "0 23 * * *"   # 20h no horario de Brasilia
  workflow_dispatch:        # permite rodar na hora, pelo botao "Run workflow"

permissions:
  contents: write           # necessario para salvar o dados.js no repositorio

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: pip install nba_api requests

      - name: Gerar os dados
        run: python gerar_dados.py

      - name: Salvar os dados no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dados.js jogos.json
          git diff --cached --quiet || git commit -m "Atualiza dados da NBA"
          git push
