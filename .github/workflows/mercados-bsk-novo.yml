name: Linhas NBA do BSK novo
on:
  push:
    branches: [main]
    paths: [.github/workflows/mercados-bsk-novo.yml]
  schedule:
    - cron: '47 18,22 * * *'
permissions:
  contents: write
concurrency:
  group: bsk-publicacao-dados
  cancel-in-progress: false
jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: melhorias-modelo-nba
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend install --no-audit --no-fund
      - name: Coletar linhas e congelar indicações
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          BSK_MARKET_LINES_PATH: ${{ runner.temp }}/linhas-bsk.json
        run: |
          python3 frontend/scripts/collect-market-lines.py
          node frontend/scripts/freeze-market-picks.mjs jogos.json "$BSK_MARKET_LINES_PATH" mercados-bsk
      - name: Publicar dados do Radar novo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mercados-bsk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualizar indicações do BSK novo'
          git pull --rebase origin melhorias-modelo-nba
          git push origin HEAD:melhorias-modelo-nba
