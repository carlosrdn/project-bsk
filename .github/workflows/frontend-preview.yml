name: BSK React - preview isolada

on:
  push:
    branches: [melhorias-modelo-nba]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bsk-frontend-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: melhorias-modelo-nba
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Comparar resultados com o motor atual
        working-directory: frontend
        run: npm test
      - name: Compilar React e TypeScript
        working-directory: frontend
        run: npm run build
      - name: Montar preview sem afetar o site clássico
        run: |
          rm -rf novo
          mkdir -p novo
          cp -R frontend/dist/. novo/
          touch novo/.nojekyll
      - name: Publicar em novo/ na branch de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A novo/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar preview React em /novo/ [skip ci]"
            git pull --rebase origin melhorias-modelo-nba
            git push origin HEAD:melhorias-modelo-nba
          fi
