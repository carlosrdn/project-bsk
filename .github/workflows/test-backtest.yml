name: Testes do backtesting

on:
  push:
    branches:
      - melhorias-modelo-nba
  pull_request:
    branches:
      - melhorias-modelo-nba

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe
        run: python -m py_compile backtest.py test_backtest.py
      - name: Executar testes offline de Python
        run: python -m unittest -v test_backtest.py
      - name: Validar JavaScript e lógica do radar
        run: |
          node --check bsk.js
          node --check test_radar.js
          node --check test_live.js
          node --check test_substitutos.js
          node --check test_quinteto.js
          node --check historico_bsk.js
          node --check test_historico.js
          node test_radar.js
          node test_live.js
          node test_substitutos.js
          node test_quinteto.js
          node test_historico.js
