name: Histórico BSK — capturar e apurar

on:
  push:
    branches: [melhorias-modelo-nba]
    paths:
      - "dados.js"
      - "bsk.js"
      - "historico_bsk.js"
      - "metricas_bsk.js"
      - "test_metricas.js"
      - ".github/workflows/historico-bsk.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Atualizar dados.js pela ESPN", "Linhas NBA do BSK novo"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
concurrency:
  group: historico-bsk-melhorias-modelo-nba
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch de testes
        uses: actions/checkout@v4
        with:
          ref: melhorias-modelo-nba
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar scripts
        run: |
          node --check historico_bsk.js
          node --check metricas_bsk.js
          node --check test_metricas.js
          node --check test_historico.js
          node test_historico.js
          node test_metricas.js
      - name: Congelar sinais dos jogos não iniciados
        id: capturar
        continue-on-error: true
        run: node historico_bsk.js capturar
      - name: Apurar partidas finalizadas
        id: apurar
        continue-on-error: true
        run: node historico_bsk.js apurar
      - name: Persistir histórico só na branch de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A historico/
          if ! git diff --cached --quiet; then
            git commit -m "Arquivar análises BSK e resultados ESPN [skip ci]"
            git pull --rebase origin melhorias-modelo-nba
            git push origin HEAD:melhorias-modelo-nba
          fi
      - name: Sinalizar falha na atualização
        if: steps.capturar.outcome == 'failure' || steps.apurar.outcome == 'failure'
        run: |
          echo '::error::Falha na captura ou na apuração. As etapas disponíveis foram persistidas.'
          exit 1
