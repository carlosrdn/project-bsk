name: Atualizar dados.js pela ESPN

on:
  push:
    branches: [melhorias-modelo-nba]
    paths: [atualizar_dados_espn.py, boletim_nba.py, gerar_dados.py, .github/workflows/dados-espn.yml]
  workflow_dispatch:
  schedule:
    # Repetição por hora para recuperar execuções atrasadas ou omitidas.
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: dados-espn-melhorias-modelo-nba
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: melhorias-modelo-nba
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .cache/espn-box-v1
          key: espn-box-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: espn-box-v1-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar leitor do boletim oficial
        run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Gerar e validar arquivos da rodada
        run: python atualizar_dados_espn.py --replay "$RUNNER_TEMP/bsk-replay.json"
      - name: Validar calibração cronológica
        run: |
          npm --prefix frontend install --no-audit --no-fund
          node frontend/scripts/calibrate.mjs "$RUNNER_TEMP/bsk-replay.json" jogos.json
          npm --prefix frontend test
      - name: Capturar projeções no histórico
        id: capturar
        continue-on-error: true
        run: node historico_bsk.js capturar
      - name: Apurar resultados do histórico
        id: apurar
        continue-on-error: true
        run: node historico_bsk.js apurar
      - name: Atualizar indicações do Radar
        id: mercados
        continue-on-error: true
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          BSK_MARKET_LINES_PATH: ${{ runner.temp }}/linhas-bsk.json
        run: |
          python3 frontend/scripts/collect-market-lines.py
          node frontend/scripts/freeze-market-picks.mjs jogos.json "$BSK_MARKET_LINES_PATH" mercados-bsk
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/espn-box-v1
          key: espn-box-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar na branch de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.js jogos.json historico/ mercados-bsk/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar dados NBA pela ESPN"
          git pull --rebase origin melhorias-modelo-nba
          git push origin HEAD:melhorias-modelo-nba
      - name: Sinalizar falha parcial após publicar os dados disponíveis
        if: steps.capturar.outcome == 'failure' || steps.apurar.outcome == 'failure' || steps.mercados.outcome == 'failure'
        run: |
          echo '::error::Uma atualização de Histórico ou Radar falhou. Consulte a etapa correspondente. Os dados válidos foram publicados.'
          exit 1
